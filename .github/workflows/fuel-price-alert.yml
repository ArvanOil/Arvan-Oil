
name: Arvan Oil Fuel Price Alerts

on:
  push:
    branches:
      - main
    paths:
      - "index.html"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect fuel price changes and notify
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python3 - <<'PY'
          import re
          import os
          import json
          import html
          import subprocess
          import urllib.request

          APP_ID = "8173a3ca-ed91-4041-b99f-576360c6fec4"

          def get_prices(revision):
              source = subprocess.check_output(
                  ["git", "show", f"{revision}:index.html"],
                  text=True
              )

              cards = re.findall(
                  r'<article class="price-card">(.*?)</article>',
                  source,
                  re.S
              )

              result = {}

              for card in cards:
                  name = re.search(r'<h3>(.*?)</h3>', card, re.S)
                  value = re.search(
                      r'<div class="(?:price|unavailable)">(.*?)</div>',
                      card,
                      re.S
                  )

                  if name and value:
                      product = re.sub(r'<.*?>', '', name.group(1))
                      status = re.sub(r'<.*?>', '', value.group(1))

                      product = html.unescape(product).strip()
                      status = html.unescape(status).strip()

                      result[product] = status

              return result

          old = get_prices("HEAD^")
          new = get_prices("HEAD")

          changes = []

          for product, new_value in new.items():
              old_value = old.get(product)

              if old_value is not None and old_value != new_value:
                  changes.append(
                      f"نرخی {product} گۆڕا\n"
                      f"{old_value} ← {new_value}"
                  )

          if not changes:
              print("No fuel price changes.")
              raise SystemExit(0)

          message = (
              "نرخی سوتەمەنی گۆڕا!\n\n"
              + "\n\n".join(changes)
          )

          payload = {
              "app_id": APP_ID,
              "included_segments": ["All"],
              "headings": {
                  "en": "وێستگەی ئارڤان"
              },
              "contents": {
                  "en": message
              },
              "url": "https://arvanoil.github.io/Arvan-Oil/"
          }

          request = urllib.request.Request(
              "https://api.onesignal.com/notifications",
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Authorization": "Key " + os.environ["ONESIGNAL_REST_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(response.read().decode("utf-8"))

          PY
