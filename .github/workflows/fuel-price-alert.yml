
name: Arvan Oil Fuel Price Alerts

on:
  push:
    branches:
      - main
    paths:
      - "index.html"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare fuel prices and notify
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import html
          import subprocess
          import urllib.request

          APP_ID = "8173a3ca-ed91-4041-b99f-576360c6fec4"

          def get_prices(revision):
              source = subprocess.check_output(
                  ["git", "show", f"{revision}:index.html"],
                  text=True
              )

              cards = re.findall(
                  r'<article class="price-card">(.*?)</article>',
                  source,
                  re.S
              )

              prices = {}

              for card in cards:
                  name = re.search(r'<h3>(.*?)</h3>', card, re.S)
                  value = re.search(
                      r'<div class="price">(.*?)</div>',
                      card,
                      re.S
                  )

                  if name and value:
                      product = re.sub(r'<.*?>', '', name.group(1))
                      price = re.sub(r'<.*?>', '', value.group(1))

                      product = html.unescape(product).strip()
                      price = html.unescape(price).strip()

                      prices[product] = price

              return prices

          before = os.environ["BEFORE_SHA"]
          current = os.environ["CURRENT_SHA"]

          if not before or set(before) == {"0"}:
              print("No previous version to compare.")
              raise SystemExit(0)

          old_prices = get_prices(before)
          new_prices = get_prices(current)

          changes = []

          for product, new_price in new_prices.items():
              old_price = old_prices.get(product)

              if old_price and old_price != new_price:
                  changes.append(
                      f"نرخی {product} گۆڕا:\n"
                      f"{old_price} ← {new_price}"
                  )

          if not changes:
              print("No fuel price changes. No notification sent.")
              raise SystemExit(0)

          message = "\n\n".join(changes)

          payload = {
              "app_id": APP_ID,
              "included_segments": ["All"],
              "headings": {
                  "en": "🔔 وێستگەی ئارڤان"
              },
              "contents": {
                  "en": message
              },
              "url": "https://arvanoil.github.io/Arvan-Oil/"
          }

          request = urllib.request.Request(
              "https://api.onesignal.com/notifications",
              data=json.dumps(
                  payload,
                  ensure_ascii=False
              ).encode("utf-8"),
              headers={
                  "Authorization": "Key " + os.environ["ONESIGNAL_REST_API_KEY"],
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(response.read().decode("utf-8"))

          print("Fuel price notification sent.")
          PY
